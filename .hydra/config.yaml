env:
  name: MultipleRooms-v0
  num_rooms: 5
  room_size: 4
  corridor_height: 1
  connector_length: 1
  max_steps: 500
  render_mode: rgb_array
  show_coordinates: false
  dense_reward: false
  goal_position:
  - 21
  - 4
  start_position:
  - 0
  - 0
task_name: ${env.name}
