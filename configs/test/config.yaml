# Test configuration for custom environments

defaults:
  - env: two_rooms  # Change this to use different env configs: single_room, two_rooms, four_rooms

test:
  num_episodes: 3
  random_seed: 42
  save_dir: 'tests/outputs/hydra/custom_env'

hydra:
  run:
    dir: tests/outputs/hydra/test/${now:%Y-%m-%d}/${now:%H-%M-%S}
