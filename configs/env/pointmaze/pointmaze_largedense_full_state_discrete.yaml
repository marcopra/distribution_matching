# @package _global_

env:
  name: "PointMaze_LargeDense-v3"
  render_mode: rgb_array
  pointmaze:
    top_down_camera: true
    discrete_actions: true
    direct_velocity_actions: false
    only_xy_position: false
    only_agent_state: true
    start_position: [-4.0, 3.0]
    start_position_variance: 0.0
    reward_type: sparse
    goal_position: [4.0, -3.0]
