# @package _global_
# Single Room Environment Configuration

env:
  name: "SingleRoom-v0"
  room_size: 15
  max_steps: 300
  render_mode: rgb_array
  show_coordinates: false

  # Goal position (optional, null uses the environment default)
  goal_position: [14, 14]  # Can be [x, y] or null for default bottom-right

  # Start position (optional, null for random at each episode)
  start_position: [0, 0]  # Exact center of the 15x15 room
