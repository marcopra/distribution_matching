# @package _global_
defaults:
  - /agent: rover
  - /env: gridworld/multiplerooms5_4x4_0
  # - override hydra/launcher: submitit_local
  
# mode
reward_free: true

# task settings
domain: gym
task_name: ${env.name}
obs_type: pixels
frame_stack: 1
action_repeat: 1
discount: 0.99
grayscale: false
resolution: 84
random_init: true
random_goal: true
update_actor_after_critic_steps: 0

# train settings
num_train_frames: 1_000_000
num_seed_frames: 2000

# eval
eval_every_frames: 25000
num_eval_episodes: 1
plot_eval_trajectories: true
eval_trajectory_plot_dir: eval_trajectory_plots
# 1-based eval checkpoints at which to save cumulative trajectory plots.
# For [20, 25, 35], plots contain the first 20, 25, 35 trajectories;
# the final eval episode is always included when this list is non-empty.
eval_trajectory_plot_episodes: [20,25,35]
eval_trajectory_plot_styles:
  - suite
  - occupancy
  - small_multiples

# snapshot
snapshots: [500000000000]
snapshot_dir: models/${obs_type}/${domain}/${agent.name}/${seed}

# replay buffer
replay_buffer_size: 1000000
replay_buffer_num_workers: 1
batch_size: ${agent.batch_size}
nstep: ${agent.nstep}
update_encoder: true

# misc
seed: 1
device: cuda
save_video: false
save_train_video: false
save_buffer: true
use_tb: true
use_wandb: false
wandb_project: "pretrain_gym"
wandb_entity: "urlb"
wandb_tag: none
wandb_run_name: ${now:%Y.%m.%d}_${now:%H%M}_${task_name}
wandb_id: none

# experiment
experiment: exp

# agent overrides
agent:
  embeddings: true
  lr_actor: 10
  pmd_steps: 250
  sink_schedule: "linear(0.0, 0.05, 50_000)"
  batch_size_actor: 5000
  T_init_steps: 300
  embedding_sum_loss: 0
  pmd_eta_mode: backtracking
  lr_T: 1e-3
  lr_encoder: 1e-3
  curl: false

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S_%f}_${agent.name}
  sweep:
    dir: ./exp_sweep/${now:%Y.%m.%d}/${now:%H%M}_${agent.name}_${experiment}
    subdir: ${hydra.job.num}
