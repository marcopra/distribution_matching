# @package _global_
defaults:
  - /agent: rover
  - /env: atari/pong
  # - override hydra/launcher: submitit_local
  
# mode
reward_free: true

# task settings
domain: gym
task_name: ${env.name}
obs_type: pixels
frame_stack: 3
action_repeat: 4
discount: 0.99
resolution: 84
grayscale: true
random_init: true
random_goal: true
update_actor_after_critic_steps: 0

# train settings
num_train_frames: 2_000_000
num_seed_frames: 5000
# eval
eval_every_frames: 25000
num_eval_episodes: 5

# snapshot
snapshots: [500000000000]
snapshot_dir: models/${obs_type}/${domain}/${agent.name}/${seed}

# replay buffer
replay_buffer_size: 2_000_000
replay_buffer_num_workers: 1
batch_size: ${agent.batch_size}
nstep: ${agent.nstep}
update_encoder: true

# misc
seed: 1
device: cuda
save_video: false
save_train_video: false
save_buffer: true
save_snapshot: true
use_tb: true
use_wandb: false
save_log: false
wandb_project: "pretrain_gym"
wandb_entity: "urlb"
wandb_tag: none
wandb_run_name: ${now:%Y.%m.%d}_${now:%H%M}_${task_name}
wandb_id: none

# experiment
experiment: exp

agent:
  curl: false
  T_init_steps: 6000

hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S_%f}_${task_name}
  sweep:
    dir: ./exp_sweep/${now:%Y.%m.%d}/${now:%H%M}_${task_name}_${experiment}
    subdir: ${hydra.job.num}
