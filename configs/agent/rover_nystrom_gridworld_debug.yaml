# @package agent
_target_: agent.rover_nystrom_gridworld_debug.RoverAgent
name: rover_nystrom_gridworld_debug
obs_type: ???
obs_shape: ???
grayscale: ${grayscale}
action_shape: ???
lr_actor: 10
discount: ${discount}
lambda_reg: 1e-6
lr_T: 1e-4
batch_size: 1024
batch_size_actor: 10000
subsamples: 4000 # ignored when nystrom_synthetic_subsamples=true
pca_truncation: 500
nystrom_synthetic_subsamples: false
debug_fixed_dataset_updates: false
subsampling_strategy: random # [random, gamma_h, reverse_gamma_h, pivoted_cholesky]
nystrom_candidate_multiplier: 5.0
nystrom_cholesky_tolerance: 1e-6
nystrom_cholesky_progress: true

# Missing GridWorld state IDs. one_action removes only excluded_action;
# all_actions removes all four state-action pairs for each listed state.
synthetic_dataset_exclude_state_idxs: []
synthetic_dataset_exclusion_mode: one_action # [one_action, all_actions]
synthetic_dataset_excluded_action: 0
synthetic_subsample_exclude_state_idxs: []
synthetic_subsample_exclusion_mode: one_action # [one_action, all_actions]
synthetic_subsample_excluded_action: 0

encoded_fifo_capacity: 100000
encoded_fifo_encode_batch_size: 4096
encoded_fifo_cuda_oom_splits: 4
max_pending_transitions: null
kernel_type: inner_product # [inner_product, gaussian, laplacian, dirac]
kernel_bandwidth: null # fixed Gaussian bandwidth; null lets pivoted Cholesky fit candidates
kernel_bandwidth_mult: null # candidate median-distance multiplier; null means 1.0
nystrom_grid_border_margin: 0.01 # inherited; unused by GridWorld helper
nystrom_grid_oversample: 2.0 # inherited; unused by GridWorld helper
nystrom_exact_grid: false # inherited; unused by GridWorld helper
nstep: 1
lr_encoder: 1e-4
curl: false
embedding_sum_loss: 0.0
hidden_dim: 1024
feature_dim: 100
T_init_steps: 1000
total_train_steps: ${num_train_frames}
update_every_steps: 100
update_actor_every_steps: 1500
pmd_steps: 100
pmd_eta_mode: backtracking
pmd_best_iterate: true
pmd_grad_clip_norm: 0.0
pmd_adagrad_eps: 1e-8
pmd_eta_min: 1e-8
pmd_eta_max: 1e8
pmd_backtrack_factor: 0.25
pmd_backtrack_max_trials: 12
sink_schedule: "linear(0.0, 0.005, 100_000)"
epsilon_schedule: 0.15
mode: l1
reward: false
embeddings: true
linear_projection: false
use_tb: ${use_tb}
use_wandb: ${use_wandb}
num_expl_steps: ???
device: ${device}
compute_dtype: float64
