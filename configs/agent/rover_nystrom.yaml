# @package agent
_target_: agent.rover_nystrom.RoverAgent
name: dist_matching
obs_type: ??? # to be specified later
obs_shape: ??? # to be specified later
grayscale: ${grayscale}
action_shape: ??? # to be specified later
lr_actor: 10 # eta
discount: ${discount} # gamma
lambda_reg: 1e-6
lr_T: 1e-4
linear_projection: false
batch_size: 1024
batch_size_actor: 10000
subsamples: 4000
nystrom_synthetic_subsamples: true
encoded_fifo_capacity: 50000
encoded_fifo_encode_batch_size: 4096
encoded_fifo_cuda_oom_splits: 4
nstep: 1
lr_encoder: 1e-4
curl: false
embedding_sum_loss: 0.0
hidden_dim: 1024
feature_dim: null
T_init_steps: 1000
total_train_steps: ${num_train_frames}
update_every_steps: 100
update_actor_every_steps: 1500
pmd_steps: 100
pmd_eta_mode: backtracking # [none, adagrad, backtracking]
pmd_best_iterate: true
pmd_grad_clip_norm: 0.0
pmd_adagrad_eps: 1e-8
pmd_eta_min: 1e-8
pmd_eta_max: 1e8
pmd_backtrack_factor: 0.25
pmd_backtrack_max_trials: 12
sink_schedule: "linear(0.0, 0.005, 100_000)"
epsilon_schedule: 0.15
mode: l1 # [l1, l2]
reward: false # whether to learn a reward predictor or not
embeddings: true  # whether to use embeddings or not, if obs_type is pixels this is always true
use_tb: ${use_tb}
use_wandb: ${use_wandb}
num_expl_steps: ??? # to be specified later
device: ${device}
compute_dtype: float64 # [float32, float64]
svd_truncation: 460 # if not null, truncates the SVD to this rank when computing the pseudo-inverse in the Nyström method, which can help with stability and speed. If null, no truncation is applied.
