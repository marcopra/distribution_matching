# @package agent
_target_: agent.rover_nystrom_pointmaze_debug.RoverAgent
name: dist_matching
obs_type: ??? # to be specified later
obs_shape: ??? # to be specified later
grayscale: ${grayscale}
action_shape: ??? # to be specified later
lr_actor: 10 # eta
discount: ${discount} # gamma
lambda_reg: 1e-6
lr_T: 1e-4
batch_size: 1024
batch_size_actor: 10000
subsamples: 4000
svd_truncation: 500
nystrom_synthetic_subsamples: true
debug_fixed_dataset_updates: false # temporary debug: train encoders and actor from fixed PointMaze grid
encoded_fifo_capacity: 100000
encoded_fifo_encode_batch_size: 4096
encoded_fifo_cuda_oom_splits: 4
kernel_type: gaussian # [inner_product, gaussian, laplacian, dirac]
kernel_bandwidth: null # fixed Gaussian bandwidth; overrides percentile fitting when set
state_kernel_bandwidth_percentile: 5.0 # try 10.0 or 15.0
state_action_kernel_bandwidth_percentile: 5.0 # try 10.0 or 15.0
nystrom_grid_border_margin: 0.01
nystrom_grid_oversample: 2.0
nstep: 1
lr_encoder: 1e-4
curl: false
embedding_sum_loss: 0.0
hidden_dim: 1024
feature_dim: null
T_init_steps: 1000
total_train_steps: ${num_train_frames}
update_every_steps: 100
update_actor_every_steps: 1500
pmd_steps: 100
pmd_eta_mode: backtracking # [none, adagrad, backtracking]
pmd_best_iterate: true
pmd_grad_clip_norm: 0.0
pmd_adagrad_eps: 1e-8
pmd_eta_min: 1e-8
pmd_eta_max: 1e8
pmd_backtrack_factor: 0.25
pmd_backtrack_max_trials: 12
sink_schedule: "linear(0.0, 0.005, 100_000)"
epsilon_schedule: 0.15
mode: l1 # [l1, l2]
reward: false # whether to learn a reward predictor or not
embeddings: true  # whether to use embeddings or not, if obs_type is pixels this is always true
use_tb: ${use_tb}
use_wandb: ${use_wandb}
num_expl_steps: ??? # to be specified later
device: ${device}
compute_dtype: float64 # [float32, float64]
