# @package agent

defaults:
  - rover_nystrom_pointmaze_debug
  - _self_

_target_: agent.rover_nystrom_subspace.RoverSubspaceCoverageAgent
exploration_metrics_enabled: false  # disable random-hash metrics and exploration_metrics.png
coverage_kernel_input: states  # pixels uses a frozen random CNN; no checkpoint is loaded
coverage_frame_index: -1  # frame used by the frozen CNN when coverage_kernel_input=pixels
coverage_state_indices: [0, 1]  # raw PointMaze x, y coordinates when coverage_kernel_input=states
train_coverage_encoder: false  # true trains separate coverage features; false keeps coverage fixed
pmd_warm_start: false  # transfer previous PMD policy to new landmarks by nearest physical state
dynamics_kernel_input: states  # states reads proprio_state; pixels reads configured image observations
dynamics_encoder_mode: raw  # raw, trainable, frozen; frozen always starts at initialization
dynamics_kernel_type: gaussian
kernel_type: ${agent.dynamics_kernel_type}  # base-agent alias; set dynamics_kernel_type only
coverage_kernel_type: gaussian
proprio_state_dims: 4  # preserve PointMaze (x, y, vx, vy) in replay metadata
coverage_kernel_bandwidth: null  # fixed bandwidth; mutually exclusive with multiplier
coverage_kernel_bandwidth_mult: null  # null shares dynamics bandwidth only when kernel types match
