# @package _global_
# Baseline-aligned PointMaze setup. Defaults to learned state dynamics and raw
# XY coverage; comparison configs override modality and encoder/kernel fields.
defaults:
  - pretrain_pointmaze_umaze_1
  - override /agent: rover_nystrom_pointmaze_subspace
  - override /env: pointmaze/pointmaze_umaze_full_state_discrete
  - _self_

num_train_frames: 1_000_000
eval_every_frames:  ${agent.update_actor_every_steps}
parallel_attach_eval_env_for_debug: true

agent:
  feature_dim: 256
  embeddings: true
  train_coverage_encoder: false
  linear_projection: true
  lr_actor: 25
  pmd_steps: 5
  update_every_steps: 100
  pmd_eta_mode: backtracking
  pca_truncation: ${agent.subsamples}
  compute_dtype: float64
  sink_schedule: linear(0.0, 0.8, 250000)
  debug_fixed_dataset_updates: false
  dynamics_kernel_input: states
  dynamics_encoder_mode: trainable  # legacy run learned this state encoder throughout training
  dynamics_kernel_type: gaussian
  coverage_kernel_input: states
  coverage_state_indices: [0, 1]
  coverage_kernel_type: gaussian
  kernel_bandwidth: null
  kernel_bandwidth_mult: 1.0
  coverage_kernel_bandwidth: null
  coverage_kernel_bandwidth_mult: 1.0
  subsampling_strategy: pivoted_cholesky
  nystrom_cholesky_tolerance: 0
  nystrom_exact_grid: false
  subsamples: 4000
  lambda_reg: 1e-6
  batch_size_actor: 16000
  update_actor_every_steps: 20000
  encoded_fifo_capacity: 1000000
  pmd_warm_start: false
  T_init_steps: 5000
  epsilon_schedule: 0.3

use_wandb: false
wandb_project: pointmaze_hp
save_eval_best: false
coverage_eval_enabled: true
coverage_num_trajectories: 50
coverage_grid_size: 90
coverage_radius: 0.08
coverage_expansion_tolerance: 0.25
plot_eval_trajectories: true
