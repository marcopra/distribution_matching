# @package _global_
# learned_xy_fast hyperparameters with trained state features for inner-product
# dynamics and fixed raw XY features for Gaussian state coverage.
defaults:
  - pretrain_pointmaze_umaze_1_subspace
  - pointmaze_subspace_common
  - _self_

obs_type: states
frame_stack: 1
env:
  continuing_task: true

agent:
  dynamics_kernel_input: states
  dynamics_encoder_mode: trainable
  dynamics_kernel_type: inner_product
  coverage_kernel_input: states
  coverage_kernel_type: gaussian
  coverage_state_indices: [0, 1]
  train_coverage_encoder: false
  update_every_steps: 10
  feature_dim: 256
  hidden_dim: 1024
  batch_size_actor: 16000
  subsamples: 4000
  pca_truncation: ${agent.subsamples}
  total_train_steps: ${num_train_frames}
  nystrom_cholesky_tolerance: 0
  exploration_metrics_enabled: false

