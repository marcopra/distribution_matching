# @package _global_
# Legacy image-dynamics/image-coverage setup. Requested comparisons use the
# explicit image_dynamics_state_coverage configs.
defaults:
  - pretrain_pointmaze_umaze_1_pixels
  - override /agent: rover_nystrom_pointmaze_subspace
  - override /env: pointmaze/pointmaze_umaze_full_state_discrete
  - _self_

obs_type: pixels
frame_stack: 3
num_train_frames: 1_000_000
eval_every_frames: 100_000
parallel_attach_eval_env_for_debug: true
p_path: none
p_path_coverage: none

agent:
  feature_dim: 256
  embeddings: true
  linear_projection: true
  train_coverage_encoder: false
  dynamics_kernel_input: pixels
  dynamics_encoder_mode: trainable
  dynamics_kernel_type: gaussian
  coverage_kernel_input: pixels
  coverage_state_indices: null
  coverage_kernel_type: gaussian
  coverage_frame_index: -1
  proprio_state_dims: 4
  kernel_bandwidth: null
  kernel_bandwidth_mult: 1.0
  coverage_kernel_bandwidth: null
  coverage_kernel_bandwidth_mult: 1.0
  update_every_steps: 100
  lr_actor: 10
  lambda_reg: 1e-6
  sink_schedule: linear(0.0, 0.8, 250000)
  subsamples: 4000
  batch_size_actor: 16000
  update_actor_every_steps: 10000

use_wandb: false
