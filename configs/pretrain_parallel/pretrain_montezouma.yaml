# @package _global_
defaults:
  - /agent: rover_nystrom_montezouma_debug
  - /env: atari/montezoumarevenge_score_masked
  # - override hydra/launcher: submitit_local
  
# mode
reward_free: true

# task settings
domain: gym
task_name: ${env.name}
obs_type: pixels
frame_stack: 3
action_repeat: 4
discount: 0.999
resolution: 84
grayscale: true
random_init: true
random_goal: true
update_actor_after_critic_steps: 0

# parallel env settings
num_envs: 100
base_seed: ${seed}
async_vector_env: true
parallel_attach_eval_env_for_debug: false

# train settings
num_train_frames: 5_000_000_000
num_seed_frames: 100000

# eval
eval_every_frames: 1_000_000
num_eval_episodes: 1

# snapshot
snapshots: [50000000000000]
snapshot_dir: models/${obs_type}/${domain}/${agent.name}/${seed}

# replay buffer
replay_buffer_size: 1000000
replay_buffer_num_workers: 1
batch_size: ${agent.batch_size}
nstep: ${agent.nstep}
update_encoder: true

# misc
seed: 1
device: cuda
save_video: false
save_train_video: false
save_buffer: false
use_tb: true
use_wandb: false
save_log: false
wandb_project: "montezouma_nystrom"
wandb_entity: "urlb"
wandb_tag: none
wandb_run_name: ${now:%Y.%m.%d}_${now:%H%M}_${task_name}
wandb_id: none

# experiment
experiment: exp

agent:
  feature_dim: 256
  embeddings: true
  lr_actor: 1000
  pmd_steps: 5
  pmd_eta_mode: backtracking
  compute_dtype: float64
  sink_schedule: 0.0
  subsampling_strategy: random
  pca_truncation: 10000
  subsamples: 10000
  lambda_reg: 1e-6
  batch_size_actor: 50000
  update_actor_every_steps: 25000
  update_every_steps: 1000
  max_pending_transitions: 5000
  T_init_steps: 10000

hydra:
  run:
    dir: ./exp_local_parallel/${now:%Y.%m.%d}/${now:%H%M%S_%f}_${task_name}_nenv${num_envs}
  sweep:
    dir: ./exp_sweep_parallel/${now:%Y.%m.%d}/${now:%H%M}_${task_name}_${experiment}
    subdir: ${hydra.job.num}
