# @package _global_
defaults:
  - /agent: ddpg_discrete
  - /env: two_rooms7_0
  # - override hydra/launcher: submitit_local

# unsupervised exploration
expl_agent: rover
# task settings
task_name:  ${env.name}
obs_type: discrete_states # [discrete_states, states, pixels]
frame_stack: 3 # only works if obs_type=pixels
action_repeat: 1 # set to 2 for pixels
resolution: 84 
random_init: true
random_goal: true
discount: 0.99
grayscale: false
reward_free: false
update_actor_after_critic_steps: 0
# train settings
num_grad_steps: 10000
log_every_steps: 5000
# eval
eval_every_steps: 250
num_eval_episodes: 1
# dataset
replay_buffer_dir: ../../../datasets # make sure to update this if you change hydra run dir
replay_buffer_size: 1000000
replay_buffer_num_workers: 4
batch_size: ${agent.batch_size}
relable: true
# misc
seed: 1
device: cuda
save_video: false
save_train_video: false
use_tb: true
use_wandb: true
wandb_id: null
wandb_project: "offline_rebuttal_rooms"
wandb_entity: "urlb"
wandb_tag: none
wandb_run_name: ${now:%Y.%m.%d}_${now:%H%M}_gym_${task_name}
# experiment
experiment: exp




hydra:
  run:
    dir: ./exp_local/${now:%Y.%m.%d}/${now:%H%M%S_%f}_${agent.name}
  sweep:
    dir: ./exp_sweep/${now:%Y.%m.%d}/${now:%H%M}_${agent.name}
    subdir: ${hydra.job.num}
