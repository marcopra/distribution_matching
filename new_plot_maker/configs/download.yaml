hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/download/${now:%Y-%m-%d_%H-%M-%S}

wandb:
  entity: null
  project: my_project
  timeout: 120

filters:
  tags:
    # Supports &, |, !tag and parentheses. Example: "(benchmark&final)|baseline"
    expression: ""
  config:
    # Config and tag filters are combined with AND.
    # Supports key=value, key==value, key!=value with &, | and parentheses.
    expression: ""

data:
  output_dir: data/raw/example
  x_key: train/frame
  y_keys:
    - train/episode_reward
  samples: 100000
  group_by_config: algorithm
  max_runs_per_group: null
