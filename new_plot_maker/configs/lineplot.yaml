hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/lineplot/${now:%Y-%m-%d_%H-%M-%S}

data:
  input_dir: data/processed/example
  x_key: train/frame
  y_key: train/episode_reward
  hue_column: Method
  # auto: CSVs directly in input_dir -> one plot; otherwise each immediate subfolder is a panel.
  # single: recursively plot all CSVs below input_dir in one axis.
  # by_subdir: always use immediate subfolders as panels.
  subplot_mode: auto

plot:
  estimator: mean
  errorbar:
    # seaborn options: ci, pi, sd, se, none
    kind: se
    level: 95
  n_boot: 1000
  linewidth: 2.2
  line_alpha: 1.0
  title: null
  debug_monotonic: false

axis:
  x_label: Steps
  y_label: Reward
  x_min: null
  x_max: null
  y_min: null
  y_max: null
  log_x: false
  log_y: false
  x_scale: 1000000
  y_scale: null

labels:
  # Raw group names come from filename prefixes before "___" or the __group column.
  rename: {}
  order: []
  colors: {}
  titles: {}
  panel_order: []

interaction:
  enabled: true
  new_config_path: configs/lineplot_custom.yaml

legend:
  location: auto
  single_location: best
  max_columns: 6
  frameon: true
  bottom_margin: 0.16

layout:
  n_rows: null
  n_cols: null
  max_cols: 3
  width_per_col: 3.35
  height_per_row: 2.55

style:
  # Options: neurips, icml, paper
  preset: neurips
  context: paper
  style: whitegrid
  font: serif
  font_scale: 1.0
  palette: colorblind
  grid_alpha: 0.25

output:
  dir: figures
  name: lineplot
  formats:
    - pdf
    - png
  dpi: 300
