data:
  input_dir: data/processed/finetune_maze
  x_key: train/frame
  y_key: train/episode_reward
  hue_column: Method
  subplot_mode: by_subdir
plot:
  estimator: median
  errorbar:
    kind: se
    level: 95
  n_boot: 1000
  linewidth: 2.2
  line_alpha: 1.0
  title: null
axis:
  x_label: Frames
  y_label: Episode reward
  x_min: 0
  x_max: 50000
  y_min: -150
  y_max: 0
  log_x: false
  log_y: false
  x_scale: 10000
  y_scale: null
labels:
  rename:
    agent.cic_discrete.CICAgent: CIC
    agent.ddpg_discrete.DDPGAgent: From Scratch
    agent.ddpg_discrete_with_kernel_actor.DDPGAgent: ROVER (Ours)
    agent.icm_apt_discrete.ICMAPTAgent: APT
    agent.rnd_discrete.RNDAgent: RND
    agent.smm_discrete.SMMAgent: SMM
  order:
  - From Scratch
  - APT
  - CIC
  - SMM
  - RND
  - ROVER (Ours)
  colors:
    APT: '#eac549'
    CIC: '#7c3204'
    From Scratch: '#ea4949'
    RND: '#009966'
    ROVER (Ours): '#0072B2'
    SMM: '#FD6600'
  titles:
    goal_10_11: goal in location [10,11]
    goal_9_1: goal in location [9,1]
    goal_7_13: goal in location [7,13]
  panel_order:
    - goal_10_11
    - goal_9_1
    - goal_7_13
interaction:
  enabled: true
  new_config_path: configs/finetune_maze_lineplot_custom.yaml
legend:
  location: bottom
  single_location: best
  max_columns: 6
  frameon: true
  bottom_margin: 0.1
layout:
  n_rows: 1
  n_cols: 3
  max_cols: 3
  width_per_col: 3.35
  height_per_row: 2.55
style:
  preset: neurips
  context: paper
  style: darkgrid
  font: serif
  font_scale: 0.5
  palette: colorblind
  grid_alpha: 0.25
output:
  dir: figures/finetune_maze
  name: goal_locations
  formats:
  - pdf
  - png
  dpi: 300
