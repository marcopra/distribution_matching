hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/lineplot/${now:%Y-%m-%d_%H-%M-%S}

data:
  input_dir: data_coverage/processed/maze_108_states_resampling_test
  x_key: num_samples
  y_key: coverage_pct
  hue_column: Algorithm
  subplot_mode: single

plot:
  estimator: mean
  errorbar:
    kind: se
    level: 95
  n_boot: 1000
  linewidth: 2.2
  line_alpha: 1.0
  title: null
  debug_monotonic: false
  align:
    enabled: true
    n_points: 250
    min_x: 0
    max_x: null
    overlap_only: false

axis:
  x_label: Resampled Observations
  y_label: State Coverage (%)
  x_min: 0
  x_max: null
  y_min: 0
  y_max: 100
  log_x: false
  log_y: false
  x_scale: 1000
  y_scale: null

labels:
  rename:
    cic: CIC
    icm_apt: ICM-APT
    maxent: MaxEnt
    rnd: RND
    smm: SMM
    dist_matching: ROVER
    rover: ROVER
  order:
    - ROVER
    - CIC
    - MaxEnt
    - SMM
    - ICM-APT
    - RND
  colors:
    ROVER: "#0173b2"
    CIC: "#56b4e9"
    MaxEnt: "#de8f05"
    SMM: "#029e73"
    ICM-APT: "#d55e00"
    RND: "#cc78bc"
  titles:
    maze_108_states_resampling_test: Maze 108 State Resampling Coverage
  panel_order: []

interaction:
  enabled: false
  new_config_path: configs/maze_108_states_resampling_test_lineplot_custom.yaml

legend:
  location: bottom
  single_location: lower right
  max_columns: 6
  frameon: true
  bottom_margin: 0.28

layout:
  n_rows: 1
  n_cols: 1
  max_cols: 3
  width_per_col: 3.8
  height_per_row: 2.65

style:
  preset: neurips
  context: paper
  style: whitegrid
  font: serif
  font_scale: 1.0
  palette: colorblind
  grid_alpha: 0.25

output:
  dir: data_coverage/figures/maze_108_states_resampling_test
  name: coverage_by_algorithm
  formats:
    - pdf
    - png
  dpi: 300
