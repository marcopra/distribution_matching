hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/process/${now:%Y-%m-%d_%H-%M-%S}

data:
  input_dir: data/raw/example
  output_dir: data/processed/example
  x_key: train/frame
  y_keys:
    - train/episode_reward

debug: false

grid:
  n_points: 200
  min_x: null
  max_x: null
  # true uses the common overlap across runs in each folder.
  # false uses the full min/max span and leaves missing outside-run regions as NaN.
  overlap_only: false
  extrapolate: false
