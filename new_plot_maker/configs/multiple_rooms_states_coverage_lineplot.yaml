hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/lineplot/${now:%Y-%m-%d_%H-%M-%S}

data:
  input_dir: data_coverage/processed/multiple_rooms_states_coverage
  x_key: num_samples
  y_key: coverage_pct
  hue_column: Algorithm
  subplot_mode: single

plot:
  estimator: mean
  errorbar:
    kind: se
    level: 95
  n_boot: 1000
  linewidth: 2.2
  line_alpha: 1.0
  title: null
  debug_monotonic: false
  align:
    enabled: true
    n_points: 250
    min_x: 0
    max_x: null
    overlap_only: false

axis:
  x_label: Replay Observations
  y_label: State Coverage (%)
  x_min: 0
  x_max: null
  y_min: 0
  y_max: 100
  log_x: false
  log_y: false
  x_scale: 1000
  y_scale: null

labels:
  rename:
    maxent: MaxEnt
    smm: SMM
    icm_apt: ICM-APT
    rnd: RND
    dist_matching: ROVER
  order:
    - ROVER
    - MaxEnt
    - SMM
    - ICM-APT
    - RND
  colors:
    ROVER: "#0173b2"
    MaxEnt: "#de8f05"
    SMM: "#029e73"
    ICM-APT: "#d55e00"
    RND: "#cc78bc"
  titles:
    multiple_rooms_states_coverage: Multiple Rooms Replay Coverage
  panel_order: []

interaction:
  enabled: false
  new_config_path: configs/multiple_rooms_states_coverage_lineplot_custom.yaml

legend:
  location: bottom
  single_location: lower right
  max_columns: 5
  frameon: true
  bottom_margin: 0.28

layout:
  n_rows: 1
  n_cols: 1
  max_cols: 3
  width_per_col: 3.6
  height_per_row: 2.65

style:
  preset: neurips
  context: paper
  style: whitegrid
  font: serif
  font_scale: 1.0
  palette: colorblind
  grid_alpha: 0.25

output:
  dir: data_coverage/figures/multiple_rooms_states_coverage
  name: coverage_by_algorithm
  formats:
    - pdf
    - png
  dpi: 300
