hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/download_finetune_maze_goal_10_11/${now:%Y-%m-%d_%H-%M-%S}

wandb:
  entity: null
  project: finetune_maze
  timeout: 120

filters:
  tags:
    expression: "!bug"
  config:
    # Change goal_position if your WandB config uses a nested key, e.g. env/goal_position.
    expression: "env/goal_position=[10,11]&(((agent/_target_=agent.icm_apt_discrete.ICMAPTAgent|agent/_target_=agent.rnd_discrete.RNDAgent|agent/_target_=agent.smm_discrete.SMMAgent|agent/_target_=agent.cic_discrete.CICAgent)&agent/actor_lr=0.0001)|agent/_target_=agent.ddpg_discrete.DDPGAgent|agent/_target_=agent.ddpg_discrete_with_kernel_actor.DDPGAgent)"

data:
  output_dir: data/raw/finetune_maze/goal_10_11
  x_key: train/frame
  y_keys:
    - train/episode_reward
  samples: 100000
  group_by_config: agent/_target_
  max_runs_per_group: null
